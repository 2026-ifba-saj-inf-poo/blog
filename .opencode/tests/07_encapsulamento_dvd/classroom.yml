name: Autograding Tests
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: testAtributosPrivados
        id: testatributosprivados
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testAtributosPrivados
          setup-command: ""
          command: mvn test -Dtest="AparelhoDVDTest#testAtributosPrivados"
          timeout: 10
          max-score: 10
      - name: testEstadoInicial
        id: testestadoinicial
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testEstadoInicial
          setup-command: ""
          command: mvn test -Dtest="AparelhoDVDTest#testEstadoInicial"
          timeout: 10
          max-score: 10
      - name: testLigarDesligar
        id: testligardesligar
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testLigarDesligar
          setup-command: ""
          command: mvn test -Dtest="AparelhoDVDTest#testLigarDesligar"
          timeout: 10
          max-score: 10
      - name: testAumentarDiminuirVolume
        id: testaumentardiminuirvolume
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testAumentarDiminuirVolume
          setup-command: ""
          command: mvn test -Dtest="AparelhoDVDTest#testAumentarDiminuirVolume"
          timeout: 10
          max-score: 15
      - name: testOperacoesSoFuncionamLigado
        id: testoperacoessofuncionamligado
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testOperacoesSoFuncionamLigado
          setup-command: ""
          command: mvn test -Dtest="AparelhoDVDTest#testOperacoesSoFuncionamLigado"
          timeout: 10
          max-score: 15
      - name: testInserirRemoverFilme
        id: testinserirremoverfilme
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testInserirRemoverFilme
          setup-command: ""
          command: mvn test -Dtest="AparelhoDVDTest#testInserirRemoverFilme"
          timeout: 10
          max-score: 10
      - name: testPlaySóComFilme
        id: testplaysocomfilme
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testPlaySóComFilme
          setup-command: ""
          command: mvn test -Dtest="AparelhoDVDTest#testPlaySóComFilme"
          timeout: 10
          max-score: 15
      - name: testStopSóEmPlay
        id: teststopsoemploy
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testStopSóEmPlay
          setup-command: ""
          command: mvn test -Dtest="AparelhoDVDTest#testStopSóEmPlay"
          timeout: 10
          max-score: 15
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          testatributosprivados_RESULTS: "${{steps.testatributosprivados.outputs.result}}"
          testestadoinicial_RESULTS: "${{steps.testestadoinicial.outputs.result}}"
          testligardesligar_RESULTS: "${{steps.testligardesligar.outputs.result}}"
          testaumentardiminuirvolume_RESULTS: "${{steps.testaumentardiminuirvolume.outputs.result}}"
          testoperacoessofuncionamligado_RESULTS: "${{steps.testoperacoessofuncionamligado.outputs.result}}"
          testinserirremoverfilme_RESULTS: "${{steps.testinserirremoverfilme.outputs.result}}"
          testplaysocomfilme_RESULTS: "${{steps.testplaysocomfilme.outputs.result}}"
          teststopsoemploy_RESULTS: "${{steps.teststopsoemploy.outputs.result}}"
        with:
          runners: testatributosprivados,testestadoinicial,testligardesligar,testaumentardiminuirvolume,testoperacoessofuncionamligado,testinserirremoverfilme,testplaysocomfilme,teststopsoemploy
