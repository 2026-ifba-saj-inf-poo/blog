name: Autograding Tests
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: testAtributosPrivados
        id: testatributosprivados
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testAtributosPrivados
          setup-command: ""
          command: mvn test -Dtest="TesouroTest#testAtributosPrivados"
          timeout: 10
          max-score: 30
      - name: testMetodoDepositarOuro
        id: testmetododepositarouro
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testMetodoDepositarOuro
          setup-command: ""
          command: mvn test -Dtest="TesouroTest#testMetodoDepositarOuro"
          timeout: 10
          max-score: 10
      - name: testMetodoSacarOuro
        id: testmetodosacarouro
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testMetodoSacarOuro
          setup-command: ""
          command: mvn test -Dtest="TesouroTest#testMetodoSacarOuro"
          timeout: 10
          max-score: 20
      - name: testMetodoAdicionarDiamantes
        id: testmetodoadicionardiamantes
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testMetodoAdicionarDiamantes
          setup-command: ""
          command: mvn test -Dtest="TesouroTest#testMetodoAdicionarDiamantes"
          timeout: 10
          max-score: 10
      - name: testNaoExisteSaqueDiamantes
        id: testnaoexistesaquediamantes
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testNaoExisteSaqueDiamantes
          setup-command: ""
          command: mvn test -Dtest="TesouroTest#testNaoExisteSaqueDiamantes"
          timeout: 10
          max-score: 15
      - name: testMetodoExibicao
        id: testmetodoexibicao
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testMetodoExibicao
          setup-command: ""
          command: mvn test -Dtest="TesouroTest#testMetodoExibicao"
          timeout: 10
          max-score: 15
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          testatributosprivados_RESULTS: "${{steps.testatributosprivados.outputs.result}}"
          testmetododepositarouro_RESULTS: "${{steps.testmetododepositarouro.outputs.result}}"
          testmetodosacarouro_RESULTS: "${{steps.testmetodosacarouro.outputs.result}}"
          testmetodoadicionardiamantes_RESULTS: "${{steps.testmetodoadicionardiamantes.outputs.result}}"
          testnaoexistesaquediamantes_RESULTS: "${{steps.testnaoexistesaquediamantes.outputs.result}}"
          testmetodoexibicao_RESULTS: "${{steps.testmetodoexibicao.outputs.result}}"
        with:
          runners: testatributosprivados,testmetododepositarouro,testmetodosacarouro,testmetodoadicionardiamantes,testnaoexistesaquediamantes,testmetodoexibicao